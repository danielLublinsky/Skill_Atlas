<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: light;
    /* aged paper */
    --surface-1: #faf8f0;
    --plane: #f1eee3;
    --text-primary: #16150f;
    --text-secondary: #4f4e44;
    --text-muted: #8a8578;
    --grid: #ded9c8;
    --baseline: #b4ae99;
    --border: rgba(22,21,15,0.16);
    --scope-user: #2a78d6;
    --scope-project: #eb6834;
    --scope-plugin: #1baf7a;
    --critical: #d03b3b;
    --warn: #b58a2a;
    --tier-searchable: #8a5cd6;
    --mono: "Berkeley Mono", ui-monospace, "SF Mono", "Cascadia Mono",
            "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      /* phosphor-dark */
      --surface-1: #191b17;
      --plane: #0e100d;
      --text-primary: #f2f4ec;
      --text-secondary: #c0c2b4;
      --text-muted: #85887a;
      --grid: #2b2e27;
      --baseline: #3d4037;
      --border: rgba(242,244,236,0.14);
      --scope-user: #3987e5;
      --scope-project: #d95926;
      --scope-plugin: #199e70;
      --critical: #d03b3b;
      --warn: #d9a83a;
      --tier-searchable: #9b6ef0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #191b17;
    --plane: #0e100d;
    --text-primary: #f2f4ec;
    --text-secondary: #c0c2b4;
    --text-muted: #85887a;
    --grid: #2b2e27;
    --baseline: #3d4037;
    --border: rgba(242,244,236,0.14);
    --scope-user: #3987e5;
    --scope-project: #d95926;
    --scope-plugin: #199e70;
    --critical: #d03b3b;
    --warn: #d9a83a;
    --tier-searchable: #9b6ef0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13.5px/1.5 var(--mono);
    color: var(--text-primary);
    background: var(--plane);
    display: flex; flex-direction: column;
  }
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 1px; }

  header {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--baseline);
    background: var(--surface-1);
    box-shadow: 0 1px 0 var(--border);
  }
  header .right { margin-left: auto; }
  .brand { display: flex; align-items: center; gap: 11px; }
  /* the mark is the graph in miniature — hub, two skills, two bundled files —
     drawn with the page's own tokens so it themes with everything else */
  .logo { width: 46px; height: 38px; display: block; flex: none; }
  header h1 {
    font-size: 18px; margin: 0; font-weight: 700; font-family: var(--mono);
    letter-spacing: 0.06em;
  }
  h1 .cursor { animation: blink 1.1s steps(1) infinite; font-weight: 400; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { h1 .cursor { animation: none; } }

  header input[type="search"] {
    width: 250px; padding: 5px 10px; border: 1px solid var(--baseline);
    border-radius: 2px; background: var(--plane); color: var(--text-primary);
    font: inherit;
  }
  header input[type="search"]::placeholder { color: var(--text-muted); }
  header input[type="checkbox"] {
    accent-color: var(--text-secondary); width: 14px; height: 14px;
  }
  header button {
    padding: 5px 13px; border: 1px solid var(--baseline); border-radius: 2px;
    background: var(--plane); color: var(--text-secondary); cursor: pointer;
    font: inherit; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  header button:hover, .menu > summary:hover { color: var(--text-primary); }
  /* view tabs: scope | categories — the primary switch, not a filter, so it
     is centred on the whole bar rather than queued in the control strip.
     Absolute centring keeps it on the bar's midline whatever the widths of
     the groups either side */
  #tabs {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: inline-flex; overflow: hidden;
    border: 1px solid var(--baseline); border-radius: 2px;
  }
  #tabs .tab {
    padding: 7px 27px; border: 0; border-right: 1px solid var(--baseline);
    border-radius: 0; background: transparent; color: var(--text-muted);
    font: inherit; font-size: 12.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; cursor: pointer;
  }
  #tabs .tab:last-child { border-right: 0; }
  #tabs .tab:hover { color: var(--text-primary); }
  #tabs .tab[aria-selected="true"] {
    color: var(--text-primary);
    background: color-mix(in srgb, var(--text-primary) 7%, var(--surface-1));
    box-shadow: inset 0 -2px 0 var(--text-primary);
  }
  /* dropdown menus: filters and plugins, same shape */
  .menu { position: relative; }
  .menu > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 5px 13px; border: 1px solid var(--baseline); border-radius: 2px;
    background: var(--plane); color: var(--text-secondary);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu[open] > summary { color: var(--text-primary); }
  /* every filter inside is meaningless in category view — the whole menu
     goes quiet rather than opening onto four dead checkboxes */
  .menu.off > summary { opacity: 0.35; pointer-events: none; }
  .menu-body {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
    min-width: 235px; max-height: 340px; overflow-y: auto;
    background: var(--surface-1); border: 1px solid var(--baseline);
    outline: 1px solid var(--border); outline-offset: 2px;
    border-radius: 2px; padding: 8px 10px; box-shadow: 0 3px 0 var(--border);
  }
  #plugin-menu .quick { display: flex; gap: 10px; margin-bottom: 6px;
    padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
  #plugin-menu .quick a { color: var(--text-muted); cursor: pointer;
    font-size: 12px; text-decoration: underline; }
  .menu-body label { display: flex; align-items: center; gap: 6px;
    padding: 2px 0; color: var(--text-secondary); cursor: pointer;
    white-space: nowrap; }
  .menu-body label:has(input:disabled) { opacity: 0.35; cursor: default; }
  #plugin-menu .count { color: var(--text-muted); font-size: 12px;
    margin-left: auto; padding-left: 10px; }
  #filter-menu { min-width: 232px; }
  /* the one filter that outlives the view switch, ruled off from the
     scope-only boxes above it so the split is visible rather than learned */
  #filter-menu label.always { margin-top: 7px; padding-top: 7px;
    border-top: 1px solid var(--grid); }
  #stage { position: relative; flex: 1; overflow: hidden; background: var(--surface-1); }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  /* the legend owns the top-right corner and never moves — it is the key to
     the picture, so it has to be findable in the same place every time */
  #legend {
    position: absolute; top: 14px; right: 14px; z-index: 10; width: 252px;
    background: var(--surface-1); border: 1px solid var(--baseline);
    outline: 1px solid var(--border); outline-offset: 2px;
    border-radius: 2px; padding: 11px 13px; box-shadow: 0 3px 0 var(--border);
    font-size: 13px;
  }
  #legend h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--text-muted); margin: 11px 0 5px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  #legend h2::after { content: ""; flex: 1; border-top: 1px solid var(--grid); }
  #legend h2:first-child { margin-top: 0; }
  #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0;
    color: var(--text-secondary); }
  .swatch { width: 18px; height: 11px; border-radius: 3px; flex: none; }
  .swatch.circle { width: 9px; height: 9px; border-radius: 50%; margin: 0 4.5px; }
  .edge-sample { width: 18px; height: 0; border-top: 2px solid var(--baseline); flex: none; }
  /* a closing line of prose, not a keyed row — it sits under a rule so it
     reads as a footnote to the legend rather than another swatch */
  #legend .legend-note { margin-top: 9px; padding-top: 7px;
    border-top: 1px solid var(--grid); color: var(--text-muted);
    font-size: 11.5px; line-height: 1.45; }
  #legend .legend-note code { font-family: inherit; color: var(--text-secondary); }

  /* parked immediately left of the legend: a fixed reading spot beats a panel
     that chases the cursor and covers the neighbourhood being inspected */
  #tooltip {
    position: absolute; top: 14px; right: 280px; z-index: 10;
    pointer-events: none; width: 344px; max-width: calc(100% - 294px);
    background: var(--surface-1); border: 1px solid var(--baseline);
    outline: 1px solid var(--border); outline-offset: 2px;
    border-radius: 2px; padding: 8px 10px; box-shadow: 0 3px 0 var(--border);
    visibility: hidden; font-size: 12.5px; color: var(--text-secondary);
    overflow-wrap: break-word;
  }
  #tooltip.on { visibility: visible; }
  #tooltip.pinned { border-color: var(--text-secondary); }
  #tooltip .tt-id { font-weight: 700; color: var(--text-primary); font-size: 13px; }
  #tooltip .tt-path { color: var(--text-muted); font-size: 11.5px; }
  #tooltip .tt-pin {
    margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--grid);
    color: var(--text-muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  footer {
    display: flex; gap: 0; flex-wrap: wrap; align-items: center;
    padding: 6px 16px; border-top: 1px solid var(--baseline);
    background: var(--surface-1); color: var(--text-muted); font-size: 12px;
  }
  footer > span + span::before { content: "▸"; margin: 0 10px; color: var(--baseline); }
  footer .warn { color: var(--critical); font-weight: 700; }

  #tableview { display: none; flex: 1; overflow: auto; padding: 14px; }
  #tableview table { border-collapse: collapse; width: 100%; background: var(--surface-1);
    font-variant-numeric: tabular-nums; }
  #tableview th, #tableview td { text-align: left; padding: 5px 10px;
    border-bottom: 1px solid var(--grid); }
  #tableview th { cursor: pointer; color: var(--text-secondary); position: sticky; top: 0;
    background: var(--surface-1); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    margin-right: 6px; vertical-align: baseline; }

  svg text.nodelabel { fill: var(--text-primary); font-size: 10px;
    font-family: var(--mono); pointer-events: none; }
  svg text.gutterlabel { fill: var(--text-muted); font-size: 9px;
    font-family: var(--mono); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.18em; }
  svg .dim { opacity: 0.14; }
  /* focused neighbourhood: the incident edges lift, they don't merely
     survive the dimming of everything else */
  svg line.hot { opacity: 1; stroke-width: 2.6px; }
  svg line.hot:not(.broken) { stroke: var(--text-primary); }
  /* a bundled file is a 4.5px dot — too small to read a size change, so it
     lights up instead: brighter body, a ring that wasn't there before */
  svg .filedot { transition: fill 120ms linear, stroke 120ms linear,
    stroke-width 120ms linear; }
  svg g.node.lit .filedot { stroke-width: 2.2px; }
  svg g.node.lit .filedot:not(.missing) {
    fill: var(--text-secondary); stroke: var(--text-primary);
  }
  @media (prefers-reduced-motion: reduce) { svg .filedot { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- category hub → two skills → two bundled files: the smallest subgraph
         that still shows what the atlas draws -->
    <svg class="logo" viewBox="0 0 34 28" fill="none" aria-hidden="true" focusable="false">
      <g stroke="var(--text-muted)" stroke-linecap="round">
        <path d="M8 14 L21.5 7" stroke-width="1.7"/>
        <path d="M8 14 L19.5 22" stroke-width="1.7"/>
        <path d="M21.5 7 L29.8 3" stroke-width="1.3"/>
        <path d="M21.5 7 L30.6 12.5" stroke-width="1.3"/>
      </g>
      <circle cx="29.8" cy="3" r="1.9" fill="var(--text-muted)"/>
      <circle cx="30.6" cy="12.5" r="1.9" fill="var(--text-muted)"/>
      <circle cx="21.5" cy="7" r="3.1" stroke-width="1.7"
              stroke="var(--scope-plugin)"
              fill="color-mix(in srgb, var(--scope-plugin) 30%, var(--surface-1))"/>
      <circle cx="19.5" cy="22" r="3.1" stroke-width="1.7"
              stroke="var(--scope-user)"
              fill="color-mix(in srgb, var(--scope-user) 30%, var(--surface-1))"/>
      <circle cx="8" cy="14" r="5.4" stroke-width="2.2"
              stroke="var(--text-primary)" fill="var(--surface-1)"/>
    </svg>
    <h1>SKILL·ATLAS<span class="cursor">▊</span></h1>
  </div>
  <input id="search" type="search" placeholder="filter skills…">
  <div id="tabs" role="tablist" aria-label="view">
    <button class="tab" role="tab" data-view="scope" aria-selected="true">scope</button>
    <button class="tab" role="tab" data-view="category" aria-selected="false">categories</button>
  </div>
  <details id="filter-filter" class="menu right">
    <summary id="filter-summary">filters ▾</summary>
    <div id="filter-menu" class="menu-body">
      <label><input type="checkbox" id="t-files"> hide files</label>
      <label><input type="checkbox" id="t-mentions"> hide mentions</label>
      <label><input type="checkbox" id="t-dangling"> dangling only</label>
      <label><input type="checkbox" id="t-unregistered"> show unregistered</label>
      <!-- reachability, not structure: it means the same thing in both views,
           so it is ruled off from the scope-only boxes and stays live -->
      <label class="always"><input type="checkbox" id="t-dormant"> hide disabled non-searchable</label>
    </div>
  </details>
  <details id="plugin-filter" class="menu">
    <summary id="plugin-summary">plugins ▾</summary>
    <div id="plugin-menu" class="menu-body"></div>
  </details>
  <button id="theme">theme</button>
</header>

<div id="stage">
  <svg id="canvas"></svg>
  <div id="legend"></div>
  <div id="tooltip"></div>
</div>
<div id="tableview"></div>

<footer id="footer"></footer>

<script id="atlas-data" type="application/json">__DATA_JSON__</script>
<script>/*__D3__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("atlas-data").textContent);
const GRAPH = DATA.graph, META = DATA.meta;

/* ---------- deterministic randomness: same graph, same picture ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashCode(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---------------------------- model building ---------------------------- */
const SCOPE_COLOR = {
  user: "var(--scope-user)", project: "var(--scope-project)",
  plugin: "var(--scope-plugin)",
};
/* filter group of a primary skill node: its plugin, or its scope for
   user/project skills */
function groupOf(n) { return n.plugin || n.scope || "other"; }
function groupLabel(g) {
  return { user: "user skills", project: "project skills" }[g] || g;
}
/* every plugin gets its own stable color — hashed from the name, so it
   never reshuffles when plugins are added or removed. Nodes keep the
   scope-green identity; the plugin color rides as a tag (and as the
   plugin-filter menu dot, so tag and menu always match). */
function pluginColor(name) {
  const hue = hashCode("plug:" + name) % 360;
  return `hsl(${hue}, 62%, 46%)`;
}
function groupColor(g) {
  return { user: SCOPE_COLOR.user, project: SCOPE_COLOR.project }[g] || pluginColor(g);
}

const allNodes = GRAPH.nodes.map(n => Object.assign({}, n));
GRAPH.unregistered_index.forEach((u, i) => {
  /* the plugin travels onto the node: an unregistered skill belongs to the
     collection it shipped in, and clusters there like an orphan does */
  allNodes.push({ id: "unreg:" + (u.plugin ? u.plugin + ":" : "") + u.name + "#" + i,
    type: "skill", name: u.name, path: u.path, scope: u.scope || "plugin",
    plugin: u.plugin || undefined,
    registered: false, enabled: false, dangling: true, unregDisplay: true });
});
const nodeById = new Map(allNodes.map(n => [n.id, n]));
const allEdges = GRAPH.edges.filter(e => nodeById.has(e.source) && nodeById.has(e.target));
const fileCount = new Map();
allEdges.forEach(e => {
  if (e.kind === "references") fileCount.set(e.source, (fileCount.get(e.source) || 0) + 1);
});
const skillTotal = allNodes.filter(n => n.type === "skill").length;
const nodeTotal = allNodes.length;

/* ------------------------------- controls ------------------------------- */
const ctl = {
  files: document.getElementById("t-files"),
  mentions: document.getElementById("t-mentions"),
  dangling: document.getElementById("t-dangling"),
  unregistered: document.getElementById("t-unregistered"),
  dormant: document.getElementById("t-dormant"),
  search: document.getElementById("search"),
};
/* a skill neither enabled nor searchable can't be reached by any path — it is
   a file on disk and nothing more. Registered skills only: unregistered ones
   are dormant by definition and already have their own toggle. */
const categoriesOf = n =>
  (n.categories && n.categories.length) ? n.categories : ["uncategorized"];
const isDormant = n => n.type === "skill" && !n.unregDisplay && !n.dangling &&
  !n.enabled && !n.searchable;
/* the by-category view is a tab, not a filter: it swaps the whole picture
   (hubs + membership) rather than subtracting from the scope view */
let viewMode = "scope";                       /* "scope" | "category" */
const isCategoryView = () => viewMode === "category";
const structuralToggles = [ctl.files, ctl.mentions, ctl.dangling, ctl.unregistered];
(function tabs() {
  const bar = document.getElementById("tabs");
  bar.addEventListener("click", ev => {
    const btn = ev.target.closest(".tab");
    if (!btn || btn.dataset.view === viewMode) return;
    viewMode = btn.dataset.view;
    bar.querySelectorAll(".tab").forEach(b =>
      b.setAttribute("aria-selected", String(b.dataset.view === viewMode)));
    /* the structural filters have no meaning in category view, so their boxes
       grey out — but the menu itself stays reachable, because the dormant
       toggle below them means the same thing in both views */
    structuralToggles.forEach(c => { c.disabled = isCategoryView(); });
    if (isCategoryView()) document.getElementById("filter-filter").open = false;
    summarizeFilters();
    renderLegend();
    drawGraph();
  });
})();
/* the boxes live behind a summary now, so their state has to read from it */
function summarizeFilters() {
  /* only count what is actually doing something: in category view the
     structural boxes are disabled, so a stale "3" would be a lie */
  const live = isCategoryView() ? [ctl.dormant]
    : structuralToggles.concat([ctl.dormant]);
  const on = live.filter(c => c.checked).length;
  document.getElementById("filter-summary").textContent =
    on ? `filters ${on} ▾` : "filters ▾";
}
/* the frozen taxonomy travels in graph.json (v3) — hub tooltips read it */
const CATEGORY_DESC = new Map((GRAPH.taxonomy || []).map(t => [t.name, t.description]));
if (nodeTotal > 200) ctl.files.checked = true;   /* §7.4 first band */

(function fillPluginFilter() {
  const groups = new Map();
  allNodes.forEach(n => {
    if (n.type !== "skill") return;
    if (n.dangling && !n.unregDisplay) return;   /* dangling targets aren't a group */
    const g = groupOf(n);
    /* a plugin known only through unregistered skills still gets a checkbox,
       but the count stays a count of registered skills */
    groups.set(g, (groups.get(g) || 0) + (n.unregDisplay ? 0 : 1));
  });
  const menu = document.getElementById("plugin-menu");
  const quick = document.createElement("div");
  quick.className = "quick";
  quick.innerHTML = "<a data-all='1'>all</a><a data-all='0'>none</a>";
  menu.appendChild(quick);
  [...groups.keys()].sort().forEach(g => {
    const label = document.createElement("label");
    label.innerHTML =
      `<input type="checkbox" value="${g}" checked>` +
      `<span class="dot" style="background:${groupColor(g)};margin:0"></span>` +
      `${groupLabel(g)}<span class="count">${groups.get(g)}</span>`;
    menu.appendChild(label);
  });
  function summarize() {
    const boxes = [...menu.querySelectorAll("input")];
    const on = boxes.filter(b => b.checked).length;
    document.getElementById("plugin-summary").textContent =
      on === boxes.length ? "plugins ▾" : `plugins ${on}/${boxes.length} ▾`;
  }
  menu.addEventListener("change", () => { summarize(); drawGraph(); });
  quick.addEventListener("click", ev => {
    if (!ev.target.dataset.all) return;
    menu.querySelectorAll("input").forEach(b => { b.checked = ev.target.dataset.all === "1"; });
    summarize(); drawGraph();
  });
})();
/* one handler for every dropdown: clicking outside closes it, and only one
   is ever open — two overlapping panels in the same corner is a mess */
document.addEventListener("click", ev => {
  document.querySelectorAll("details.menu[open]").forEach(d => {
    if (!d.contains(ev.target)) d.open = false;
  });
});
document.querySelectorAll("details.menu").forEach(d => {
  d.addEventListener("toggle", () => {
    if (!d.open) return;
    document.querySelectorAll("details.menu[open]").forEach(o => {
      if (o !== d) o.open = false;
    });
  });
});
function activeGroups() {
  return new Set([...document.querySelectorAll("#plugin-menu input:checked")]
    .map(b => b.value));
}
/* the hub a skill clusters on: the first category it is filed under */
const homeCategory = n => categoriesOf(n)[0];

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).colorScheme.includes("dark");
  root.dataset.theme = dark ? "light" : "dark";
});

/* -------------------------------- legend -------------------------------- */
/* the legend is the key to the picture, so it keys the picture actually on
   screen: category view draws no files, references, mentions or dangling
   targets, and a legend still explaining them is four lines of noise over a
   view that can't produce them. Re-rendered on every tab switch. */
function renderLegend() {
  const el = document.getElementById("legend");
  const scopeRows = ["user", "project", "plugin"].map(s =>
    `<div class="row"><span class="swatch" style="background:${SCOPE_COLOR[s]}"></span>${s}</div>`).join("");

  if (isCategoryView()) {
    el.innerHTML = `
      <h2>scope</h2>${scopeRows}
      <h2>state</h2>
      <div class="row"><span class="swatch" style="background:color-mix(in srgb, var(--scope-plugin) 22%, var(--surface-1));border:1.5px solid var(--scope-plugin)"></span>enabled</div>
      <div class="row"><span class="swatch" style="background:var(--surface-1);border:1.5px solid var(--scope-plugin)"></span>disabled</div>
      <div class="row"><span class="swatch" style="background:transparent;border:1.5px solid var(--tier-searchable)"></span>searchable (dormant)</div>
      <h2>membership</h2>
      <div class="row"><span class="swatch circle" style="background:var(--surface-1);border:2px solid var(--text-primary)"></span>category hub</div>
      <div class="row"><span class="edge-sample"></span>home category</div>
      <div class="row"><span class="edge-sample" style="border-top-style:dashed"></span>also filed under</div>
      <div class="row"><span class="swatch circle" style="background:var(--warn)"></span>stale category label</div>
      <div class="legend-note">hub size tracks member count · search <code>cat:name</code> to isolate one category</div>`;
    return;
  }

  el.innerHTML = `
    <h2>scope</h2>${scopeRows}
    <div class="row"><span class="swatch" style="background:var(--surface-1);border:1.5px solid var(--text-muted);border-left:4px solid var(--scope-user)"></span>plugin identity bar</div>
    <h2>state</h2>
    <div class="row"><span class="swatch" style="background:color-mix(in srgb, var(--scope-plugin) 22%, var(--surface-1));border:1.5px solid var(--scope-plugin)"></span>enabled</div>
    <div class="row"><span class="swatch" style="background:var(--surface-1);border:1.5px solid var(--scope-plugin)"></span>disabled</div>
    <div class="row"><span class="swatch" style="background:transparent;border:1.5px solid var(--tier-searchable)"></span>searchable (dormant)</div>
    <div class="row"><span class="swatch" style="background:var(--surface-1);border:1.5px dashed var(--text-muted)"></span>dangling · unregistered</div>
    <div class="row"><span class="swatch circle" style="background:var(--warn)"></span>stale category label</div>
    <h2>edges</h2>
    <div class="row"><span class="edge-sample"></span>references</div>
    <div class="row"><span class="edge-sample" style="border-top-style:dashed"></span>mentions</div>
    <div class="row"><span class="edge-sample" style="border-top-color:var(--critical)"></span>broken reference</div>
    <div class="row"><span class="edge-sample" style="border-top-style:dotted;border-top-color:var(--critical)"></span>dangling mention</div>
    <h2>files</h2>
    <div class="row"><span class="swatch circle" style="background:var(--text-muted)"></span>bundled file</div>
    <div class="row"><span class="swatch circle" style="background:var(--surface-1);border:1.5px solid var(--critical)"></span>file missing on disk</div>
    <div class="legend-note">hover a node to light its neighbourhood · click to pin the panel</div>`;
}
renderLegend();

/* -------------------------------- footer -------------------------------- */
(function footer() {
  const s = GRAPH.stats;
  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const parts = [];
  parts.push(META.view === "project" && META.project_name
    ? `view: ${esc(META.project_name)}` : "view: global");
  parts.push(`generated ${META.generated_at}`);
  parts.push(`${s.skills} skills (${s.enabled} enabled) · ${s.files} files · ${s.edges} edges`);
  if (s.duplicate_names && s.duplicate_names.length)
    parts.push(`<span class="warn">duplicate names: ${s.duplicate_names.join(", ")}</span>`);
  if (s.dangling || s.broken_refs)
    parts.push(`<span class="warn">${s.dangling} dangling · ${s.broken_refs} broken refs</span>`);
  /* TODO states, not defects — plain text, no warn class (DESIGN-PHASE2 §3.3) */
  if (s.uncategorized || s.stale_categories) {
    const todo = [];
    if (s.uncategorized) todo.push(`${s.uncategorized} uncategorized`);
    if (s.stale_categories) todo.push(`${s.stale_categories} stale categories`);
    parts.push(`${todo.join(" · ")} — run /skill-atlas`);
  }
  if (META.stale) parts.push(`<span class="warn">⚠ graph.json is older than the newest SKILL.md or manifest — rebuild</span>`);
  document.getElementById("footer").innerHTML = parts.map(p => `<span>${p}</span>`).join("");
})();

/* ------------------------------ table view ------------------------------ */
function buildTable() {
  const degree = new Map();
  allEdges.forEach(e => {
    degree.set(e.source, (degree.get(e.source) || 0) + 1);
    degree.set(e.target, (degree.get(e.target) || 0) + 1);
  });
  const rows = allNodes.filter(n => n.type === "skill" && !n.unregDisplay).map(n => ({
    name: n.name, id: n.id, scope: n.scope || "", plugin: n.plugin || "",
    tier: n.enabled ? "enabled" : (n.searchable ? "searchable" : "off"),
    categories: (n.categories || []).join(", "),
    degree: degree.get(n.id) || 0,
  }));
  const cols = ["name", "scope", "plugin", "tier", "categories", "degree"];
  let sortKey = "name", asc = true;
  const container = document.getElementById("tableview");
  function draw() {
    rows.sort((a, b) => (a[sortKey] < b[sortKey] ? -1 : a[sortKey] > b[sortKey] ? 1 : 0) * (asc ? 1 : -1));
    container.innerHTML = `<table><thead><tr>${cols.map(c =>
      `<th data-k="${c}">${c}${c === sortKey ? (asc ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead><tbody>` +
      rows.map(r => `<tr><td><span class="dot" style="background:${SCOPE_COLOR[r.scope] || "var(--text-muted)"}"></span>${r.id}</td>` +
        cols.slice(1).map(c => `<td>${r[c]}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
    container.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
      const k = th.dataset.k; asc = k === sortKey ? !asc : true; sortKey = k; draw();
    }));
  }
  draw();
}

/* ---------------------------- graph rendering ---------------------------- */
const svg = d3.select("#canvas");
const viewport = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", ev => viewport.attr("transform", ev.transform));
svg.call(zoom);
const tooltip = document.getElementById("tooltip");
let pinned = null;
let sim = null;

function visibleModel() {
  const hideFiles = ctl.files.checked;
  const hideMentions = ctl.mentions.checked;
  const danglingOnly = ctl.dangling.checked;
  const showUnreg = ctl.unregistered.checked;
  const hideDormant = ctl.dormant.checked;
  const active = activeGroups();
  const reachable = n => !(hideDormant && isDormant(n));

  /* category view (§7.1, amended): ONLY category hubs + member skills +
     membership edges — no files, references, mentions, dangling targets or
     orphans. The structural picture belongs to the scope view. Hubs live in
     the picture, never in graph.json; multi-category skills hang between
     their hubs. */
  if (isCategoryView()) {
    const members = allNodes.filter(n =>
      n.type === "skill" && !n.dangling && !n.unregDisplay && active.has(groupOf(n)) &&
      reachable(n));
    const hubs = new Map();
    const memberEdges = [];
    members.forEach(n => {
      categoriesOf(n).forEach((c, i) => {
        if (!hubs.has(c)) hubs.set(c, { id: "cat:" + c, type: "cat", name: c, count: 0 });
        hubs.get(c).count += 1;
        memberEdges.push({ source: n.id, target: "cat:" + c, kind: "member", home: i === 0 });
      });
    });
    return { nodes: members.concat([...hubs.values()].sort((a, b) => (a.name < b.name ? -1 : 1))),
             edges: memberEdges };
  }

  /* primary skills pass the plugin filter; files and dangling targets are
     dependent nodes — they survive only through edges from visible skills */
  const primary = new Set(allNodes.filter(n =>
    n.type === "skill" && !n.dangling && !n.unregDisplay && active.has(groupOf(n)) &&
    reachable(n)
  ).map(n => n.id));

  let edges = allEdges.filter(e => {
    if (hideFiles && e.kind === "references") return false;
    if (hideMentions && e.kind === "mentions") return false;
    if (danglingOnly && !(e.kind === "dangling" || e.broken)) return false;
    if (!primary.has(e.source)) return false;
    const target = nodeById.get(e.target);
    if (target && target.type === "skill" && !target.dangling && !primary.has(e.target))
      return false;   /* mention into a filtered-out plugin: drop the edge too */
    return true;
  });
  const keep = new Set();
  edges.forEach(e => { keep.add(e.source); keep.add(e.target); });
  let nodes = allNodes.filter(n => {
    if (n.unregDisplay) return showUnreg && active.has(groupOf(n));
    if (n.type === "file") return !hideFiles && keep.has(n.id);
    if (n.dangling) return keep.has(n.id);
    if (!primary.has(n.id)) return false;
    if (danglingOnly) return keep.has(n.id);
    return true;
  });
  const present = new Set(nodes.map(n => n.id));
  edges = edges.filter(e => present.has(e.source) && present.has(e.target));
  return { nodes, edges };
}

function nodeSize(n) {
  if (n.type === "file") return { r: 4.5 };
  if (n.type === "cat") return { r: 14 + 3 * Math.sqrt(n.count || 1) };
  const w = Math.max(52, 14 + n.name.length * 6.2);
  return { w: w, h: 22 };
}

function drawGraph() {
  const { nodes, edges } = visibleModel();
  viewport.selectAll("*").remove();
  pinned = null;
  tooltip.classList.remove("on", "pinned");   /* a redraw releases the pin */
  if (sim) sim.stop();

  const width = document.getElementById("stage").clientWidth || 1200;
  const height = document.getElementById("stage").clientHeight || 800;

  /* one cluster centre per filter group (plugin name, or scope for
     user/project/built-in skills); in category view the home category
     clusters instead, and hubs anchor their own cluster. Files inherit the
     group of a skill that references them so bundles stay with their owner */
  const catMode = isCategoryView();
  const skillKey = n => catMode ? homeCategory(n) : groupOf(n);
  const fileGroup = new Map();
  edges.forEach(e => {
    if (e.kind !== "references") return;
    const s = nodeById.get(e.source);
    if (s && s.type === "skill") fileGroup.set(e.target, skillKey(s));
  });
  const clusterKey = n => n.type === "file" ? (fileGroup.get(n.id) || "file")
    : n.type === "cat" ? n.name : skillKey(n);
  const groupNames = [...new Set(nodes.map(clusterKey))].sort();
  const centers = new Map();
  const R = Math.min(width, height) * Math.min(0.62, 0.3 + groupNames.length * 0.045);
  groupNames.forEach((g, i) => {
    const a = (i / groupNames.length) * 2 * Math.PI - Math.PI / 2;
    centers.set(g, groupNames.length === 1 ? [width / 2, height / 2]
      : [width / 2 + Math.cos(a) * R * 1.25, height / 2 + Math.sin(a) * R * 0.8]);
  });
  const centerOf = n => centers.get(clusterKey(n)) || [width / 2, height / 2];

  const rng = mulberry32(42);
  nodes.forEach(n => {
    const c = centerOf(n);
    const h = hashCode(n.id);
    n.x = c[0] + ((h % 997) / 997 - 0.5) * 160;
    n.y = c[1] + (((h >> 10) % 997) / 997 - 0.5) * 160;
    n.fx = null; n.fy = null;
    const size = nodeSize(n);
    n._w = size.w || (size.r ? size.r * 2 : 9); n._h = size.h || 9;
  });

  /* orphans and unregistered skills float free as ordinary nodes (amended —
     no gutter): with no edges of their own, the cluster forces settle them
     beside the plugin they shipped in, which is the fact worth seeing */
  sim = d3.forceSimulation(nodes)
    .randomSource(rng)
    .force("link", d3.forceLink(edges.map(e => Object.assign({}, e)))
      .id(d => d.id)
      /* a skill in several categories is tied hard to its home hub and only
         loosely to the rest: a long, weak secondary link lets it sit beside
         the category that owns it instead of floating at the midpoint
         between equals. Single-category skills are unaffected. */
      .distance(e => e.kind === "references" ? 85
        : e.kind === "member" ? (e.home ? 110 : 170) : 170)
      .strength(e => e.kind === "member" && !e.home ? 0.22 : 0.5))
    .force("charge", d3.forceManyBody().strength(-320).distanceMax(460))
    .force("x", d3.forceX(d => centerOf(d)[0]).strength(d => d.type === "file" ? 0.05 : 0.11))
    .force("y", d3.forceY(d => centerOf(d)[1]).strength(d => d.type === "file" ? 0.05 : 0.11))
    .force("collide", d3.forceCollide(d => d.type === "file" ? 11
      : d.type === "cat" ? d._w / 2 + 26 : d._w * 0.42 + 14).iterations(2))
    .stop();
  const simEdges = sim.force("link").links();
  for (let i = 0; i < 300; i++) sim.tick();   /* deterministic warm-up → same opening picture twice */

  /* category hubs are landmarks, not floating nodes: once the warm-up has
     placed them they hold still, so dragging one skill can't drift every
     category out from under the reading. Only a drag on the hub itself
     moves it, and it stays where the hand drops it (see drag "end") */
  if (catMode) nodes.forEach(n => { if (n.type === "cat") { n.fx = n.x; n.fy = n.y; } });

  /* fit the settled layout into the viewport */
  if (nodes.length) {
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const x0 = Math.min(...xs) - 90, x1 = Math.max(...xs) + 90;
    const y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + 50;
    const k = Math.min(2, 0.98 * Math.min(width / (x1 - x0), height / (y1 - y0)));
    svg.call(zoom.transform, d3.zoomIdentity
      .translate(width / 2 - k * (x0 + x1) / 2, height / 2 - k * (y0 + y1) / 2)
      .scale(k));
  }

  const edgeSel = viewport.append("g").selectAll("line").data(simEdges).join("line")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
    .classed("broken", d => !!(d.broken || d.kind === "dangling"))
    .attr("stroke", d => (d.broken || d.kind === "dangling") ? "var(--critical)" : "var(--baseline)")
    /* membership carries the whole category view the way references carry the
       scope view, so it is drawn at the same weight — at the old 1.2/0.5 it
       read as background texture next to a scope-view reference line. The
       secondary tie stays lighter than the home tie, but as a legible dash
       rather than a dotted whisper */
    .attr("stroke-width", d => d.kind === "member" ? (d.home ? 1.5 : 1.4)
      : d.kind === "mentions" ? 1.9 : 1.4)
    /* mentions read as a firm dash rather than a faint dotted whisper: one
       skill naming another is a real relation, and at the old weight it
       disappeared against the reference lines */
    .attr("stroke-dasharray", d => d.kind === "member" ? (d.home ? null : "4,3")
      : d.kind === "mentions" ? "6,3"
      : (d.kind === "dangling" ? "2,4" : null))
    .attr("opacity", d => d.kind === "member" ? (d.home ? 0.8 : 0.62)
      : d.kind === "mentions" ? 0.95 : 0.75);

  /* faint caption over each cluster, behind the edges — redundant in
     category view, where the hubs carry their own labels */
  const captionLayer = viewport.insert("g", ":first-child");
  groupNames.forEach(g => {
    if (g === "file" || catMode) return;
    const members = nodes.filter(n => clusterKey(n) === g && n.type === "skill");
    if (!members.length) return;
    const mx = members.reduce((s, n) => s + n.x, 0) / members.length;
    const my = Math.min(...members.map(n => n.y)) - 36;
    captionLayer.append("text").attr("class", "gutterlabel")
      .attr("text-anchor", "middle").attr("x", mx).attr("y", my)
      .attr("opacity", 0.75).text(groupLabel(g));
  });

  const nodeSel = viewport.append("g").selectAll("g.node").data(nodes).join("g")
    .attr("class", "node").attr("transform", d => `translate(${d.x},${d.y})`)
    .style("cursor", "pointer");

  nodeSel.each(function (d) {
    const g = d3.select(this);
    if (d.type === "file") {
      g.append("circle").attr("r", 4.5)
        .attr("class", d.exists === false ? "filedot missing" : "filedot")
        .attr("fill", d.exists === false ? "var(--surface-1)" : "var(--text-muted)")
        .attr("stroke", d.exists === false ? "var(--critical)" : "var(--text-muted)")
        .attr("stroke-width", 1.4);
      return;
    }
    if (d.type === "cat") {
      const r = nodeSize(d).r;
      g.append("circle").attr("r", r)
        .attr("fill", "var(--surface-1)")
        .attr("stroke", "var(--text-primary)").attr("stroke-width", 2);
      g.append("text").attr("class", "nodelabel")
        .attr("text-anchor", "middle").attr("y", r + 13)
        .style("font-weight", "700")
        .text(`${d.name} (${d.count})`);
      return;
    }
    const { w, h } = nodeSize(d);
    const color = SCOPE_COLOR[d.scope] || "var(--text-muted)";
    /* disabled skills read hollow but are painted with the stage colour, not
       left transparent: edges run to the node centre, and a see-through box
       let them cross the label */
    g.append("rect")
      .attr("x", -w / 2).attr("y", -h / 2).attr("width", w).attr("height", h)
      .attr("rx", 3)
      .attr("fill", d.enabled ? `color-mix(in srgb, ${color} 30%, var(--surface-1))` : "var(--surface-1)")
      .attr("stroke", d.dangling ? "var(--text-muted)" : color)
      .attr("stroke-width", d.enabled ? 1.6 : 1.3)
      .attr("stroke-dasharray", d.dangling ? "4,3" : null);
    /* searchable halo: dormant-but-findable is its own channel, distinct
       from both enabled fill and plain-disabled hollow (§7.2) */
    if (d.searchable)
      g.append("rect")
        .attr("x", -w / 2 - 3).attr("y", -h / 2 - 3)
        .attr("width", w + 6).attr("height", h + 6).attr("rx", 5)
        .attr("fill", "none").attr("stroke", "var(--tier-searchable)")
        .attr("stroke-width", 1.3);
    if (d.category_stale)
      g.append("circle").attr("cx", w / 2 - 3).attr("cy", -h / 2 + 3)
        .attr("r", 3).attr("fill", "var(--warn)");
    /* plugin identity tag: a color bar on the left edge, unique per plugin */
    if (d.plugin)
      g.append("rect")
        .attr("x", -w / 2).attr("y", -h / 2).attr("width", 4).attr("height", h)
        .attr("rx", 2).attr("fill", pluginColor(d.plugin));
    g.append("text").attr("class", "nodelabel")
      .attr("text-anchor", "middle").attr("dy", "0.34em")
      .style("fill", d.enabled ? "var(--text-primary)" : "var(--text-muted)")
      .text(d.name);
    const files = fileCount.get(d.id);
    if (ctl.files.checked && files)
      g.append("text").attr("class", "nodelabel").attr("x", w / 2 + 4)
        .attr("dy", "0.34em").attr("fill", "var(--text-muted)")
        .style("font-size", "9px").text("◦" + files);
  });

  /* interactions */
  const neighbor = new Map();
  simEdges.forEach(e => {
    if (!neighbor.has(e.source.id)) neighbor.set(e.source.id, new Set());
    if (!neighbor.has(e.target.id)) neighbor.set(e.target.id, new Set());
    neighbor.get(e.source.id).add(e.target.id);
    neighbor.get(e.target.id).add(e.source.id);
  });
  function focus(id) {
    const incident = d => d.source.id === id || d.target.id === id;
    const hood = new Set([id, ...(neighbor.get(id) || [])]);
    nodeSel.classed("dim", d => !hood.has(d.id)).classed("lit", d => hood.has(d.id));
    edgeSel.classed("dim", d => !incident(d)).classed("hot", incident);
  }
  function unfocus() {
    nodeSel.classed("dim", false).classed("lit", false);
    edgeSel.classed("dim", false).classed("hot", false);
  }

  function tooltipHTML(d) {
    if (d.type === "cat") {
      const desc = CATEGORY_DESC.get(d.name) ||
        (d.name === "uncategorized" ? "skills not yet categorized — run /skill-atlas" : "");
      return `<div class="tt-id">${d.name} (${d.count})</div>` +
        (desc ? `<div>${desc}</div>` : "");
    }
    return `
      <div class="tt-id">${d.id}</div>
      ${d.description ? `<div>${d.description}</div>` : ""}
      <div>${d.type === "file" ? "bundled file" : (d.scope || "")}` +
      `${d.plugin ? " · " + d.plugin + (d.version ? " " + d.version : "") : ""}` +
      `${d.type !== "file" ? " · " + (d.enabled ? "enabled" : (d.searchable ? "searchable" : "disabled")) : ""}` +
      `${d.type !== "file" && d.categories && d.categories.length ? " · " + d.categories.join(", ") + (d.category_stale ? " (stale)" : "") : ""}` +
      `${d.registered === false ? " · unregistered" : ""}</div>
      ${d.path ? `<div class="tt-path">${d.path}</div>` : `<div class="tt-path">no file on disk</div>`}`;
  }
  /* pinning freezes the whole reading: the panel holds the clicked node and
     the highlight stays with it, so hovering elsewhere can't desynchronise
     the two. Click the node again, or the background, to release. */
  function showTooltip(d, isPinned) {
    tooltip.innerHTML = tooltipHTML(d) +
      (isPinned ? `<div class="tt-pin">pinned · click again to release</div>` : "");
    tooltip.classList.add("on");
    tooltip.classList.toggle("pinned", !!isPinned);
  }
  function hideTooltip() { tooltip.classList.remove("on", "pinned"); }

  nodeSel.on("mouseenter", (ev, d) => {
    if (pinned) return;
    showTooltip(d, false);
    focus(d.id);
  }).on("mouseleave", () => {
    if (pinned) return;
    hideTooltip();
    unfocus();
  }).on("click", (ev, d) => {
    ev.stopPropagation();
    pinned = (pinned && pinned.id === d.id) ? null : d;
    if (pinned) { showTooltip(d, true); focus(d.id); }
    else { showTooltip(d, false); focus(d.id); }   /* still hovering it */
  });
  svg.on("click", () => { pinned = null; hideTooltip(); unfocus(); });

  nodeSel.call(d3.drag()
    .on("start", (ev, d) => {
      if (!ev.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on("end", (ev, d) => {
      if (!ev.active) sim.alphaTarget(0);
      if (d.type === "cat") return;   /* hubs keep the position the user gave them */
      d.fx = null; d.fy = null;
    }));

  sim.on("tick", () => {
    edgeSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  applySearch();
  function applySearch() {
    const q = ctl.search.value.trim().toLowerCase();
    if (!q) { if (!pinned) unfocus(); return; }
    /* cat:<name> filters to one category's members (§7.2) */
    if (q.startsWith("cat:")) {
      const cat = q.slice(4).trim();
      nodeSel.classed("dim", d => {
        if (d.type === "cat") return d.name !== cat;
        if (d.type !== "skill") return true;
        const cats = (d.categories && d.categories.length) ? d.categories : ["uncategorized"];
        return !cats.includes(cat);
      });
      edgeSel.classed("dim", true).classed("hot", false);
      return;
    }
    nodeSel.classed("dim", d => d.type === "cat" ? false :
      !(d.name.toLowerCase().includes(q) || (d.description || "").toLowerCase().includes(q) || d.id.toLowerCase().includes(q)));
    edgeSel.classed("dim", true).classed("hot", false);
  }
  ctl.search.oninput = applySearch;
}

/* ------------------------------ view switch ------------------------------ */
const useTable = nodeTotal > 600;   /* §7.4 second band */
if (useTable) {
  document.getElementById("stage").style.display = "none";
  document.getElementById("tableview").style.display = "block";
  buildTable();
  const btn = document.createElement("button");
  btn.textContent = `render graph anyway (${nodeTotal} nodes)`;
  btn.style.margin = "0 0 10px";
  btn.addEventListener("click", () => {
    document.getElementById("tableview").style.display = "none";
    document.getElementById("stage").style.display = "block";
    drawGraph();
  });
  document.getElementById("tableview").prepend(btn);
} else {
  drawGraph();
}
structuralToggles.concat([ctl.dormant]).forEach(c =>
  c.addEventListener("change", () => { summarizeFilters(); drawGraph(); }));
summarizeFilters();   /* the >200-node default checks "hide files" for us */
window.addEventListener("resize", () => { if (!useTable) drawGraph(); });
</script>
</body>
</html>
