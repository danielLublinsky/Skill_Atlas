name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The plugin cache is keyed by version: `cache/<marketplace>/<plugin>/<version>/`
  # is never re-extracted once it exists, and `claude plugin update` declines a
  # same-version change outright ("already at the latest version"). So a push
  # that changes shipped code without changing the version reaches the
  # marketplace metadata and updates nothing anyone runs. This job says so.
  bump-guard:
    name: version bumped when shipped code changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the version against what shipped before
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Branch creation pushes a null base, and a rewritten history can
          # leave a base this clone no longer has. Nothing to compare against.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against — skipping"; exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE not in this clone (rewritten history?) — skipping"; exit 0
          fi

          # Everything under these paths is copied into the installed plugin
          # and changes what the plugin does. Docs, tests, dev tooling and CI
          # ride along in the cache too, but a stale copy of them harms nobody.
          SHIPPED='skills/ scripts/ commands/ hooks/ vendor/ .claude-plugin/'
          changed=$(git diff --name-only "$BASE" HEAD -- $SHIPPED)

          if [ -z "$changed" ]; then
            echo "no shipped code changed — a bump is not required"; exit 0
          fi

          ver() { git show "$1:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'; }
          before=$(ver "$BASE")
          after=$(ver HEAD)

          echo "shipped paths changed:"
          echo "$changed" | sed 's/^/  /'
          echo "version: $before -> $after"

          if [ "$before" = "$after" ]; then
            echo
            echo "::error::Shipped code changed but the version is still $after."
            echo "Installed users will not receive this push — 'claude plugin update'"
            echo "declines a same-version change. Run 'make release' and push the bump."
            exit 1
          fi

          # Users track whatever main says, in either direction — a lower
          # version rolls the whole fleet back. That is a real recovery move,
          # but it is far more often a mistake, and it is the dangerous
          # direction: an old version number hands users the cache directory
          # they already have, stale contents and all, instead of a fresh
          # extraction. Deliberate rollbacks say so in the commit message.
          lower() { python3 -c "import sys;p=lambda s:tuple(int(x) for x in s.split('.'));sys.exit(0 if p(sys.argv[2])<p(sys.argv[1]) else 1)" "$1" "$2"; }
          if lower "$before" "$after"; then
            if git log -1 --format=%B HEAD | grep -qiE '\[(rollback|downgrade)\]'; then
              echo "version decreased $before -> $after — allowed by [rollback] in the commit message"
            else
              echo
              echo "::error::Version went DOWN, $before -> $after."
              echo "Every installed user is rolled back to $after, and anyone who already"
              echo "has a $after cache directory keeps its old contents rather than this code."
              echo "If that is what you want, put [rollback] in the commit message."
              exit 1
            fi
          fi

          # Both manifests must agree or the marketplace advertises one version
          # while the installed plugin.json reports another.
          market=$(git show "HEAD:.claude-plugin/marketplace.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["plugins"][0]["version"])')
          if [ "$market" != "$after" ]; then
            echo "::error::plugin.json says $after but marketplace.json says $market — they must match."
            exit 1
          fi

          echo "ok: version moved $before -> $after, both manifests agree"

  test:
    name: tests · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Just the ends of the supported range: 3.9 is the floor the code is
        # written to, "3.x" tracks whatever the newest stable release is. If
        # both ends pass, a version in between failing would be a Python
        # regression, not ours.
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit suite (fixtures only — never touches a real ~/.claude)
        run: make test

  build:
    name: build + render against a fixture home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a graph from the fixture tree
        env:
          SKILL_ATLAS_CLAUDE_DIR: tests/fixtures/fakehome
        run: |
          python3 scripts/build_graph.py; status=$?
          # exit 1 means "built, with dangling references found" — that is the
          # tool reporting on its inputs, not a build failure. Only 2 is fatal.
          if [ $status -eq 2 ]; then exit 2; fi

      - name: Render the atlas
        env:
          SKILL_ATLAS_CLAUDE_DIR: tests/fixtures/fakehome
        run: python3 scripts/render.py

      - name: Assert the output is self-contained
        run: |
          html=$(find . -name atlas.html -not -path './.git/*' | head -1)
          test -n "$html" || { echo "no atlas.html produced"; exit 1; }
          # The whole point of the renderer: opens from file:// with no network.
          if grep -qE '<script[^>]+src=|<link[^>]+href="https?:' "$html"; then
            echo "atlas.html references an external resource"; exit 1
          fi
          grep -q "Copyright 2010-2023 Mike Bostock" "$html" \
            || { echo "vendored D3 notice missing from output"; exit 1; }
          echo "ok: $(wc -c < "$html") bytes, no external references"
